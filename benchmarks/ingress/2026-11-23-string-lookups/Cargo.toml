[package]
name = "string-lookups"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha1 = "0.10"
sha2 = "0.10"
ahash = { version = "0.8", default-features = false, features = ["std"] }
hashbrown = { version = "0.16", default-features = false, features = ["allocator-api2"] }
serde_json = "1"

[profile.browser]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"

[features]
apple-sha = []
