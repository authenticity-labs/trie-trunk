[package]
name = "data-seeds-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
data-seeds = { path = ".." }
pil-codec = { package = "pill-packer", path = "../../../../pill-packer/rust" }
ciborium = "0.2.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

