[package]
name = "seed-query-language"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
data-seeds = { path = "..", default-features = false, features = ["query-language"] }
serde_json = "1"
[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
