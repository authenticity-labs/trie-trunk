[package]
name = "trie-trunk-taxonomy"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["rlib", "cdylib"]
[features]
registration = ["dep:pil-codec", "dep:serde", "dep:ciborium", "dep:sha2"]

[dependencies]
pil-codec = { package = "pill-packer", path = "../../../pill-packer/rust", default-features = false, features = ["api"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
ciborium = { version = "0.2.2", optional = true }
sha2 = { version = "0.10", optional = true }
crc32c = "0.6.8"
serde_json = "1"
[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

[[example]]
name = "author_shapes"
required-features = ["registration"]
