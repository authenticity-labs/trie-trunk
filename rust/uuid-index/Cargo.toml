[package]
name = "trunk-uuid-index"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

[dependencies]
crc32c = "0.6.8"

[dev-dependencies]
tempfile = "3.27.0"
memmap2 = "0.9.11"

[features]
historical-benchmarks = []

[[example]]
name = "history_layout_compare"
required-features = ["historical-benchmarks"]

[[example]]
name = "hot_vs_paged"
required-features = ["historical-benchmarks"]

[[example]]
name = "slotted_concurrent"
required-features = ["historical-benchmarks"]

[[example]]
name = "slotted_fixture"
required-features = ["historical-benchmarks"]

[[example]]
name = "slotted_measure"
required-features = ["historical-benchmarks"]
